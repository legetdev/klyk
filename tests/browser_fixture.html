<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Klyk Browser Fixture</title>
<style>body{font:24px system-ui;padding:70px}input,button{font:inherit;padding:12px;margin:12px}#result{margin:20px}</style>
<h1>Klyk Browser Fixture</h1>
<label>Fixture input <input aria-label="Fixture input" id="input"></label>
<button id="increment">Increment browser</button><p id="result">Count 0</p>
<script>
// Report actual browser events to the disposable loopback test server.
const input=document.getElementById('input');
const increment=document.getElementById('increment');
const result=document.getElementById('result');
let count=0,sequence=0,pasteEvents=0,pasteText=null;
// Sequence browser events so a delayed earlier request cannot replace newer evidence.
function report(){fetch('/state',{method:'POST',body:JSON.stringify({sequence:++sequence,count,text:input.value,paste_events:pasteEvents,paste_text:pasteText})});}
// Keep the actual disposable paste payload before the browser applies its default input action.
input.addEventListener('paste',event=>{pasteEvents++;pasteText=(event.clipboardData?.getData('text/plain')??'').slice(0,1024);report();});
increment.onclick=()=>{result.textContent='Count '+(++count);report();};
input.oninput=report;
report();
</script></html>
