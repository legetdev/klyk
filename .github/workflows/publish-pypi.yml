name: Publish to PyPI

# Publishes klyk to PyPI when a GitHub Release is published, via PyPI Trusted
# Publishing (OIDC). No API token is stored anywhere — PyPI verifies a short-
# lived identity GitHub mints for this exact repo + workflow + environment.
#
# ONE-TIME SETUP (PyPI web UI → Account → Publishing → "Add a pending publisher"):
#   PyPI Project Name:  klyk
#   Owner:              legetdev
#   Repository name:    klyk
#   Workflow filename:  publish-pypi.yml
#   Environment name:   pypi
# (Already configured.) After that, every published GitHub Release auto-uploads.
#
# Actions are pinned to commit SHAs (not moving tags) so a hijacked action tag
# can't swap code into this token-minting job. The trailing comment is the tag.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish after a failed upload
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require an existing stable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName > /tmp/release.json
          python3 -c 'import json, os; r=json.load(open("/tmp/release.json")); assert not r["isDraft"] and not r["isPrerelease"] and r["tagName"] == os.environ["RELEASE_TAG"]'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Match the package version to the release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          python -c 'import ast, os; t=ast.parse(open("klyk/__init__.py").read()); v=next(ast.literal_eval(n.value) for n in t.body if isinstance(n, ast.Assign) and any(isinstance(x, ast.Name) and x.id == "__version__" for x in n.targets)); assert "v" + v == os.environ["RELEASE_TAG"]'
      - name: Portable regression and source privacy checks
        run: |
          python -m pip install .
          python -B -m unittest discover -s tests
          python tests/release_check.py
      - name: Build wheel + sdist and validate metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python tests/release_check.py --archives
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      # No source checkout, package installation, or tests in the credentialed job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
